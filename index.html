<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camel Drop Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <!-- Left Panel: Main Screen Tools -->
    <div id="leftPanel">
        <button id="shovelButton" class="icon-button hidden"
            data-tooltip="Shovel: Sweep all visible camels off the screen. They fall through the ground!">
            <img src="assets/shovel icon.png" alt="Shovel">
        </button>
    </div>

    <!-- Right Panel: Counter + Chest -->
    <div id="rightPanel">
        <div id="camelCounter" class="counter-item">
            <img id="camelCounterIcon" src="assets/camel icon.png" alt="Camel" class="counter-icon">
            <span id="camelCountDisplay">0</span>
        </div>
        <button id="chestButton" class="icon-button chest-button"
            data-tooltip="Management: View resources, buildings, actions, and active processes.">
            <img src="assets/chest.png" alt="Inventory Chest">
        </button>
    </div>

    <!-- Management Slide Panel -->
    <div id="inventoryPanel">
        <div id="inventoryHeader">
            <span>📦 Management</span>
            <button id="closeInventory" class="close-btn">✕</button>
        </div>
        <div class="inv-section date-row">
            <div id="gameDateDisplay"></div>
            <button id="speedToggleBtn" class="inv-btn" data-tooltip="Toggle 2x speed for game-time progression.">⏩ 2x: OFF</button>
        </div>
        <div class="inv-section">
            <h3 class="inv-section-title">Resources</h3>
            <div id="resourceList"></div>
        </div>
        <div class="inv-section">
            <h3 class="inv-section-title">Actions & Buildings</h3>
            <div id="buildingActions"></div>
        </div>
        <div class="inv-section">
            <h3 class="inv-section-title">Active Processes</h3>
            <div id="activeProcesses"></div>
        </div>
        <div id="ownershipPanel" class="ownership-panel hidden">
            <div class="ownership-header">
                <span id="ownershipTitle">Owned</span>
                <button id="closeOwnershipPanel" class="close-btn">✕</button>
            </div>
            <div id="ownershipContent" class="ownership-content"></div>
        </div>
    </div>

    <!-- Log Panel -->
    <div id="logPanel"></div>

    <!-- Menu Button -->
    <button id="menuButton" data-tooltip="Game Menu: Save, load, or adjust settings.">☰</button>

    <!-- Menu Panel -->
    <div id="menuPanel">
        <div id="menuHeader">
            <span>⚙️ Menu</span>
            <button id="closeMenu" class="close-btn">✕</button>
        </div>
        <div id="menuContent">
            <button id="newGameBtn" class="menu-btn">🆕 New Game</button>
            <button id="saveGameBtn" class="menu-btn">💾 Save Game</button>
            <button id="loadGameBtn" class="menu-btn">📂 Load Game</button>
            <button id="toggleMusicBtn" class="menu-btn">🎵 Music: ON</button>
            <button id="toggleSfxBtn" class="menu-btn">🔊 SFX: ON</button>
            <button id="hotdogBtn" class="menu-btn" disabled data-tooltip="Unlocks when you get 10 hotdog.">🌭 Hotdog (Locked)</button>
        </div>
        <div id="saveLoadArea" class="hidden">
            <textarea id="saveLoadText" rows="3"></textarea>
            <button id="saveLoadConfirm" class="menu-btn">✅ Confirm Load</button>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="hidden"></div>

    <!-- Spawn Button -->
    <button id="spawnButton">Drop a Camel!</button>
    <div id="smasherLayer"></div>
    <div id="princeEvent" class="hidden">
        <img id="princeImage" src="assets/princ.png" alt="Prince">
        <div id="princeBubble" class="hidden"></div>
    </div>

    <!-- First Camel Audio Choice Modal -->
    <div id="audioChoiceOverlay" class="hidden">
        <div id="audioChoiceModal">
            <p id="audioChoiceText">The camels roar through the silence of the desert.</p>
            <div class="audio-choice-actions">
                <button id="keepAudioBtn" class="menu-btn">Keep Audio</button>
                <button id="disableAudioBtn" class="menu-btn">Disable Audio</button>
            </div>
        </div>
    </div>

    <!-- Audio -->
    <audio id="backgroundMusic" loop>
        <source src="assets/soundsssss.wav" type="audio/wav">
    </audio>
    <audio id="camelSound">
        <source src="assets/camel-male-sound-effect-370202.mp3" type="audio/mpeg">
    </audio>

    <script src="script2d.js"></script>
</body>
</html>
