<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200">
  <defs>
    <style>
      .bg { fill: #0f0c08; }
      .title { fill: #ffd700; font: 700 36px Arial, sans-serif; }
      .subtitle { fill: #d8c49a; font: 400 18px Arial, sans-serif; }
      .box { fill: #1b1510; stroke: #8c6b2b; stroke-width: 2; rx: 14; }
      .txt { fill: #f0e6d0; font: 500 18px Arial, sans-serif; }
      .small { fill: #c8b89a; font: 400 15px Arial, sans-serif; }
      .line { stroke: #8c6b2b; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c6b2b"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="2200"/>

  <text class="title" x="60" y="70">Camel Game Systems Flowchart</text>
  <text class="subtitle" x="60" y="102">Ordered by first appearance + unlock costs + production details</text>

  <!-- Start -->
  <rect class="box" x="60" y="150" width="470" height="120" rx="14"/>
  <text class="txt" x="82" y="188">Game Start</text>
  <text class="small" x="82" y="214">- Oct 24, 2014 start date</text>
  <text class="small" x="82" y="236">- 1 game day = 120 real seconds</text>
  <text class="small" x="82" y="258">- Drop button active</text>

  <rect class="box" x="590" y="150" width="470" height="120" rx="14"/>
  <text class="txt" x="612" y="188">Base Camel Production</text>
  <text class="small" x="612" y="214">- +1 camel every 6 real seconds</text>
  <text class="small" x="612" y="236">- Drop click: +1 camel with physics spawn</text>

  <path class="line" d="M530 210 L590 210"/>

  <!-- Early unlocks -->
  <rect class="box" x="60" y="340" width="470" height="120" rx="14"/>
  <text class="txt" x="82" y="378">Unlock: Shovel</text>
  <text class="small" x="82" y="404">- Requirement: 10 camels</text>
  <text class="small" x="82" y="426">- Clears visible camels only</text>

  <rect class="box" x="590" y="340" width="470" height="140" rx="14"/>
  <text class="txt" x="612" y="378">Unlock: Caravan</text>
  <text class="small" x="612" y="404">- Requirement: 100 camels</text>
  <text class="small" x="612" y="426">- Cost: 100 camels per caravan</text>
  <text class="small" x="612" y="448">- First trip: 3 days, then 5-11 days</text>

  <path class="line" d="M825 270 L825 340"/>
  <path class="line" d="M295 270 L295 340"/>

  <!-- Caravan rewards -->
  <rect class="box" x="1120" y="340" width="420" height="190" rx="14"/>
  <text class="txt" x="1142" y="378">Caravan Rewards (single roll)</text>
  <text class="small" x="1142" y="404">- 88%: 5 silver</text>
  <text class="small" x="1142" y="426">- 11%: 1 gold + 4 silver</text>
  <text class="small" x="1142" y="448">- 1%: 1 hotdog + 4 silver</text>
  <text class="small" x="1142" y="474">- Enables Silver/Gold/Hotdog discovery</text>
  <path class="line" d="M1060 410 L1120 410"/>

  <!-- Hunt -->
  <rect class="box" x="60" y="560" width="470" height="120" rx="14"/>
  <text class="txt" x="82" y="598">Unlock: Hunt</text>
  <text class="small" x="82" y="624">- Requirement: 3 silver</text>
  <text class="small" x="82" y="646">- Cost: 3 silver -> Reward: 50 camels</text>
  <path class="line" d="M1210 530 L1210 620 L530 620"/>

  <!-- Prince event -->
  <rect class="box" x="590" y="560" width="470" height="140" rx="14"/>
  <text class="txt" x="612" y="598">Prince Reward Event (one-time)</text>
  <text class="small" x="612" y="624">- Trigger: 250 camels</text>
  <text class="small" x="612" y="646">- Reward: 1 Silver Mine</text>
  <text class="small" x="612" y="668">- Logs prince message</text>

  <!-- Mines -->
  <rect class="box" x="60" y="760" width="700" height="220" rx="14"/>
  <text class="txt" x="82" y="798">Silver Mine (max 1)</text>
  <text class="small" x="82" y="824">- Build cost: 1000 camels (or prince gift)</text>
  <text class="small" x="82" y="846">- Capacity: 100 base, 1000 (10k camel upgrade), 10000 (25k upgrade)</text>
  <text class="small" x="82" y="868">- Production: 5 assigned camels -> 1 silver/day</text>
  <text class="small" x="82" y="890">- No fractional payout (internal progress buffer)</text>
  <text class="small" x="82" y="912">- Assigned camels consume grass: 1/day each</text>
  <text class="small" x="82" y="934">- Assignment managed in Mine Management panel</text>

  <rect class="box" x="800" y="760" width="740" height="220" rx="14"/>
  <text class="txt" x="822" y="798">Gold Mine (max 1)</text>
  <text class="small" x="822" y="824">- Build cost: 5000 camels</text>
  <text class="small" x="822" y="846">- Capacity: 50 base, 500 (10k camel upgrade), 1000 (25k upgrade)</text>
  <text class="small" x="822" y="868">- Production: 1 assigned camel -> 1 gold every 10 days</text>
  <text class="small" x="822" y="890">- No fractional payout (internal progress buffer)</text>
  <text class="small" x="822" y="912">- Assigned camels consume grass: 1/day each</text>
  <text class="small" x="822" y="934">- Assignment managed in Mine Management panel</text>

  <path class="line" d="M825 700 L825 760"/>

  <!-- Farm + workers -->
  <rect class="box" x="60" y="1040" width="700" height="230" rx="14"/>
  <text class="txt" x="82" y="1078">Farm (max 1)</text>
  <text class="small" x="82" y="1104">- Build cost: 99 silver OR 1 gold</text>
  <text class="small" x="82" y="1126">- Farm no longer creates camels; it creates grass</text>
  <text class="small" x="82" y="1148">- Worker output: 100 grass/day each</text>
  <text class="small" x="82" y="1170">- Worker salary: 1 per day (pay mode silver/gold toggle)</text>
  <text class="small" x="82" y="1192">- ON/OFF supported in farm management panel</text>
  <text class="small" x="82" y="1214">- First farm purchase triggers prince worker gift (+1 worker)</text>
  <text class="small" x="82" y="1236">- Unlocks Scout action</text>

  <rect class="box" x="800" y="1040" width="740" height="180" rx="14"/>
  <text class="txt" x="822" y="1078">Scout Worker Hiring</text>
  <text class="small" x="822" y="1104">- Cost: 5 gold</text>
  <text class="small" x="822" y="1126">- Duration: 5-8 game days</text>
  <text class="small" x="822" y="1148">- Reward: 1-3 workers</text>
  <text class="small" x="822" y="1170">- Active process shown in Management</text>

  <path class="line" d="M760 1140 L800 1140"/>

  <!-- Automation -->
  <rect class="box" x="60" y="1320" width="470" height="140" rx="14"/>
  <text class="txt" x="82" y="1358">Button Smasher Automation</text>
  <text class="small" x="82" y="1384">- Cost: 500 camels</text>
  <text class="small" x="82" y="1406">- 20 auto-presses/day per smasher</text>
  <text class="small" x="82" y="1428">- Visual: flying =* around Drop button</text>

  <!-- Late systems -->
  <rect class="box" x="590" y="1320" width="470" height="160" rx="14"/>
  <text class="txt" x="612" y="1358">Banquet</text>
  <text class="small" x="612" y="1384">- Unlock: 10,000 camels</text>
  <text class="small" x="612" y="1406">- Cost: 10,000 camels</text>
  <text class="small" x="612" y="1428">- Duration: 10 days</text>
  <text class="small" x="612" y="1450">- Reward: 4 hotdogs</text>

  <rect class="box" x="1120" y="1320" width="420" height="160" rx="14"/>
  <text class="txt" x="1142" y="1358">Race</text>
  <text class="small" x="1142" y="1384">- Unlock: 25,000 camels</text>
  <text class="small" x="1142" y="1406">- Cost: 25,000 camels</text>
  <text class="small" x="1142" y="1428">- Duration: 25 days</text>
  <text class="small" x="1142" y="1450">- Reward: 1 hotdog + 3 warrior camels</text>

  <!-- University -->
  <rect class="box" x="60" y="1520" width="700" height="170" rx="14"/>
  <text class="txt" x="82" y="1558">University</text>
  <text class="small" x="82" y="1584">- Build cost: 100 gold</text>
  <text class="small" x="82" y="1606">- Conversion: 1 hotdog -> 1 warrior camel</text>
  <text class="small" x="82" y="1628">- Conversion time: 100 days</text>
  <text class="small" x="82" y="1650">- Managed as active process</text>

  <!-- Management + Save -->
  <rect class="box" x="800" y="1520" width="740" height="300" rx="14"/>
  <text class="txt" x="822" y="1558">Management + Persistence</text>
  <text class="small" x="822" y="1584">- Management page is full-width slide-in</text>
  <text class="small" x="822" y="1606">- Sections: Date, Speed, Resources, Actions/Buildings, Active Processes</text>
  <text class="small" x="822" y="1628">- Farm/Mine dedicated management sub-panels</text>
  <text class="small" x="822" y="1650">- Auto-save to localStorage + Manual Save/Load menu kept</text>
  <text class="small" x="822" y="1672">- Saved data includes:</text>
  <text class="small" x="842" y="1694">workers, grass, scouts, mine upgrades, mine assignments,</text>
  <text class="small" x="842" y="1716">mine progress buffers, button smashers, audio choices/settings,</text>
  <text class="small" x="842" y="1738">prince triggers, first-camel audio prompt state, unlock flags.</text>
  <text class="small" x="822" y="1762">- Load restores all systems with migration from older saves</text>

  <text class="subtitle" x="60" y="1860">Detailed flow summary generated for publishing/design reference.</text>
</svg>
